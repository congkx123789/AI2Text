model_name: "ViEnASR_ConformerStyle_25M_BPE2k_Fixed"

# === Model capacity (~25M params, encoder-only CTC) ===
# Deep & thin: 16 layers, d_model=320, FFN=1280, 4 heads (~25M params)
d_model: 320               # Hidden size (tăng từ 256 -> 320 để đạt ~25M)
num_encoder_layers: 16     # Depth
num_heads: 4               # 320 / 4 = 80 dim/head
d_ff: 1280                 # 4x d_model
dropout: 0.1

# Audio features (compatible với pipeline hiện tại)
sample_rate: 16000
n_mels: 80
n_fft: 400
hop_length: 160
win_length: 400

# === Tokenization (BPE ~2000 subwords, bilingual Vi+En) ===
tokenizer_type: "bpe"
bpe_vocab_path: "models/bilingual_bpe_2k.json"  # Được build bằng build_bpe_vocab.py
vocab_size: 2000

# === Training hyperparameters (tối ưu cho RTX 5060 Ti 16GB, Ryzen 9, 64GB RAM) ===
# Đã gặp OOM với batch 64 -> giảm xuống 40 cho an toàn. Nếu vẫn OOM, hạ tiếp 32.
batch_size: 32
num_epochs: 120
learning_rate: 0.0005       # LR cao hơn theo linear scaling rule với batch 64
weight_decay: 0.01
grad_clip: 1.0
gradient_accumulation_steps: 2
warmup_pct: 0.05             # ~5% steps warmup cho 400h là đủ
use_constant_lr_on_resume: true

# Mixed precision (BF16 only) + I/O tối ưu cho phần cứng của bạn
use_amp: true                 # BF16 mixed precision (không dùng FP16)
num_workers: 16               # Ryzen 9 9900X nhiều core -> 12–16 đều ổn
pin_memory: true
prefetch_factor: 4           # CPU prefetch mạnh hơn, tận dụng Ryzen 9
persistent_workers: true
sort_by_length: true
cache_in_ram: false           # Dataset rất lớn -> không cache full vào RAM
use_bucketing: true

# === Data sources (dùng full_merged_dataset file-based – đúng như bạn yêu cầu) ===
dataset_root: "data/processed/full_merged_dataset"
database_path: "database/asr_training.db"
split_version: "v2_merged"

# === Timestamp training (streaming-friendly CTC + timestamps nhẹ) ===
use_timestamps: true
timestamp_loss_weight: 0.01

# === Checkpointing & logging ===
checkpoint_dir: "checkpoints"
save_every: 5
log_file: "logs/training_small_25m_bpe2k.log"

run_name: "vien_asr_25m_bpe2k_$(date +%Y%m%d)"  # Chỉ mang tính mô tả, không phải shell expand

# === Auto-Rollback (tự cứu khi loss nổ) ===
auto_rollback:
  enabled: true
  threshold_ratio: 1.3
  patience: 1

# === Curriculum Learning (bật timestamps khi model đã “nghe” tạm ổn, tránh bias câu quá ngắn) ===
curriculum_learning:
  enabled: true
  start_timestamp_epoch: 2
  required_wer: 0.70
  initial_ts_weight: 0.01
  short_sentence_epochs: 3
  max_duration_seconds: 10.0


