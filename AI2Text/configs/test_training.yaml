# Test configuration for quick validation of language embedding
# SHORT training run with SMALLER model to verify everything works

# Model architecture (SMALLER for quick test)
model_name: "VietnameseASR_Test_Small"
d_model: 256              # Reduced from 1024 for test
num_encoder_layers: 4     # Reduced from 24 for test
num_heads: 4              # Reduced from 16 for test
d_ff: 1024                # Reduced from 4096 for test
dropout: 0.1

# Audio processing
sample_rate: 16000
n_mels: 80

# Tokenization
tokenizer_type: "bpe"
bpe_vocab_path: "models/bilingual_bpe_18k.json"
vocab_size: 18000

# Training hyperparameters (TEST - SHORT RUN)
batch_size: 2             # Reduced for test
num_epochs: 2             # Only 2 epochs for quick test
learning_rate: 0.0001
weight_decay: 0.01
grad_clip: 0.5
gradient_accumulation_steps: 2  # Reduced for test
warmup_pct: 0.05

# Optimization
use_amp: true             # BF16 mixed precision (không dùng FP16)
num_workers: 2            # Reduced for test
pin_memory: true
prefetch_factor: 2
persistent_workers: false # Disable for test
sort_by_length: true
cache_in_ram: false
use_bucketing: false

# Data - Using merged_dataset (smaller for quick test)
dataset_root: "data/processed/merged_dataset"  # Smaller dataset for quick test
database_path: "database/asr_training.db"
split_version: "v1"

# Timestamp training
use_timestamps: true
timestamp_loss_weight: 0.01

# Checkpointing
checkpoint_dir: "checkpoints"
save_every: 1             # Save every epoch for test

# Logging
log_file: "logs/test_training.log"

# Training run
run_name: "test_language_embedding"

# Auto-Rollback
auto_rollback:
  enabled: true
  threshold_ratio: 1.3
  patience: 1

# Curriculum Learning
curriculum_learning:
  enabled: true
  start_timestamp_epoch: 3
  required_wer: 0.70
  initial_ts_weight: 0.01
