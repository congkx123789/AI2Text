model_name: "ViEnASR_ConformerStyle_60M_BPE2k"

# === Model capacity (~55–65M params, encoder-only CTC) ===
# Lớn hơn bản 25M: tăng chiều rộng + thêm layer nhưng vẫn phù hợp RTX 5060 Ti 16GB
d_model: 384               # Hidden size (tăng từ 256 → 384)
num_encoder_layers: 20     # Độ sâu 20 layer
num_heads: 6               # 6 heads (384 / 6 = 64 dim/head)
d_ff: 1536                 # ≈4x d_model
dropout: 0.1

# Audio features
sample_rate: 16000
n_mels: 80
n_fft: 400
hop_length: 160
win_length: 400

# === Tokenization (BPE 2k, giữ nguyên vocab hiện tại) ===
tokenizer_type: "bpe"
bpe_vocab_path: "models/bilingual_bpe_2k.json"
vocab_size: 2000

# === Training hyperparameters (tối ưu cho GPU 16GB) ===
# Model to hơn → batch size nên giảm một chút so với 25M.
batch_size: 24                 # Nếu đủ VRAM có thể tăng lên 32
num_epochs: 120
learning_rate: 0.0006          # Hơi thấp hơn bản 25M (ổn định hơn cho model lớn)
weight_decay: 0.01
grad_clip: 1.0
gradient_accumulation_steps: 1
warmup_pct: 0.1
use_constant_lr_on_resume: true

use_amp: true                  # BF16 mixed precision (không dùng FP16)
num_workers: 12
pin_memory: true
prefetch_factor: 2
persistent_workers: true
sort_by_length: true
cache_in_ram: false
use_bucketing: false

# === Data sources (full_merged_dataset như hiện tại) ===
dataset_root: "data/processed/full_merged_dataset"
database_path: "database/asr_training.db"
split_version: "v2_merged"

# === Timestamps & curriculum (giữ logic như bản 25M) ===
use_timestamps: true
timestamp_loss_weight: 0.01

checkpoint_dir: "checkpoints"
save_every: 5
log_file: "logs/training_medium_60m_bpe2k.log"

run_name: "vien_asr_60m_bpe2k_$(date +%Y%m%d)"

auto_rollback:
  enabled: true
  threshold_ratio: 1.3
  patience: 1

curriculum_learning:
  enabled: true
  start_timestamp_epoch: 3
  required_wer: 0.70
  initial_ts_weight: 0.01
  short_sentence_epochs: 5
  max_duration_seconds: 4.0


