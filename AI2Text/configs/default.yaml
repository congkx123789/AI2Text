# Default configuration for ASR training
# Optimized for Vietnamese speech recognition on resource-constrained hardware

# Model architecture - Tiny (~30-40M parameters) for ~75h data
model_name: "VietnameseASR_Tiny_Char"
d_model: 256               # Reduced hidden size for compact model
num_encoder_layers: 8      # Shallower encoder, enough for 75h
num_heads: 4               # Fewer attention heads
d_ff: 1024                 # Typically 4 * d_model
dropout: 0.2               # Slightly higher dropout to combat overfitting

# Audio processing
sample_rate: 16000
n_mels: 80
n_fft: 400
hop_length: 160
win_length: 400

# Tokenization
tokenizer_type: "char"          # Use compact character-level tokenizer
# Optional character-level vocab built from manifest (see build_vocab.py)
char_vocab_path: "models/vocab_char_level.json"
# Approximate vocab size; actual size is len(tokenizer)
vocab_size: 256

# Training hyperparameters (optimized cho ~12–16GB VRAM, batch lớn)
# Batch 60 để tối đa hóa throughput (có thể cần giảm nếu OOM)
batch_size: 60                 # 60 samples / step – rất lớn, tối ưu tốc độ nếu VRAM đủ
num_epochs: 150                # Train thêm 50 epochs nữa từ epoch 100 (resume training)
learning_rate: 0.0003           # Giảm nhẹ so với đỉnh cũ (0.0005), nhưng đủ cao để học tiếp - giữ ổn định khi resume
weight_decay: 0.0001            # Giảm weight decay nhẹ hơn
grad_clip: 0.5                   # Siết chặt gradient clipping để tránh nổ số
gradient_accumulation_steps: 1  # Effective batch size = 48 (không tích lũy thêm – tận dụng tối đa VRAM)
warmup_pct: 0.08                # Tăng warmup để model khởi động êm hơn, tránh blank collapse
use_constant_lr_on_resume: true  # Khi resume, dùng constant LR thay vì OneCycleLR (tránh LR giảm về 0)

# Optimization for powerful hardware (Ryzen 9 9900X, 64GB RAM, RTX 5060 Ti 16GB, SSD 3000MB/s)
# Tối ưu cho dataset lớn (300GB) - không cache RAM để tránh OOM
use_amp: true                  # BF16 mixed precision (không dùng FP16)
num_workers: 8                 # Tăng lên để CPU đọc data kịp cho GPU (dataset lớn)
pin_memory: true               # Faster CPU→GPU transfer
prefetch_factor: 2             # Giữ mức thấp để tiết kiệm RAM (dataset lớn)
persistent_workers: true       # Keep workers alive between epochs (faster)
sort_by_length: true           # Sort by duration to reduce padding waste
cache_in_ram: false           # QUAN TRỌNG: Tắt cache RAM để tránh tràn bộ nhớ (OOM) với dataset lớn
use_bucketing: false           # Simple sorting is faster

# Data - Using merged_dataset (file-based, not database)
dataset_root: "data/processed/merged_dataset"  # Path to merged_dataset directory
database_path: "database/asr_training.db"  # Still used for training run tracking
split_version: "v2_merged"  # For reference only

# Timestamp training
use_timestamps: true  # Enable timestamp prediction
timestamp_loss_weight: 0.01  # Reduced from 0.1 to 0.01 - timestamp loss was destabilizing the model (exploded from 3.28 to 6.3)

# Checkpointing
checkpoint_dir: "checkpoints"
save_every: 5

# Logging
log_file: "logs/training.log"

# Training run
run_name: "vietnamese_asr_300m_full_dataset_20251201"  # Chuyển sang dataset lớn (300GB)

# Cấu hình Tự động sửa lỗi (Auto-Run / Self-Healing)
# Hệ thống sẽ tự động phát hiện và khắc phục khi model bị collapse

# Auto-Rollback: Tự động phát hiện loss explosion và rollback về checkpoint tốt nhất
auto_rollback:
  enabled: true              # Bật/tắt tính năng tự động rollback
  threshold_ratio: 1.3       # Nếu Loss tăng gấp 1.3 lần (30%) so với mức tốt nhất -> Rollback
  patience: 1                # Số epoch cho phép bị lỗi trước khi rollback

# Curriculum Learning: Học theo lộ trình - chỉ bật Timestamp khi model đã sẵn sàng
curriculum_learning:
  enabled: true              # Bật/tắt tính năng curriculum learning
  start_timestamp_epoch: 3   # Chỉ bắt đầu xét duyệt bật Timestamp sau epoch này
  required_wer: 0.70         # Chỉ bật Timestamp nếu WER đã giảm dưới ngưỡng này (0.70 = 70%)
  initial_ts_weight: 0.01     # Trọng số khởi điểm nhẹ nhàng cho Timestamp loss
  short_sentence_epochs: 5    # Train với câu ngắn (<4s) trong 5 epochs đầu
  max_duration_seconds: 4.0  # Chỉ train câu < 4 giây trong giai đoạn curriculum

