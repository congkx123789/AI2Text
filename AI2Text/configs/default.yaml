# Default configuration for ASR training
# BILINGUAL TRAINING: Vietnamese + English
# Optimized for full_merged_dataset with bilingual support
# Dataset: ~194k training samples (77% Vietnamese, 23% English)

# Model architecture - Transformer ASR with Language Embedding
# OPTIMIZED FOR BILINGUAL (Vietnamese + English) - ~36M parameters
model_name: "VietnameseASR_Transformer_Bilingual_36M"
d_model: 320               # Model dimension
num_encoder_layers: 14     # Number of encoder layers
num_heads: 8                # Number of attention heads
d_ff: 3120                 # Feed-forward dimension (tuned to achieve ~36M parameters)
dropout: 0.2               # Dropout rate

# Audio processing
sample_rate: 16000
n_mels: 80
n_fft: 400
hop_length: 160
win_length: 400

# Tokenization - SentencePiece BPE for Bilingual (Vietnamese + English)
tokenizer_type: "sentencepiece"  # Changed from "bpe" to "sentencepiece"
bpe_vocab_path: "models/tokenizer_vi_en_3500.model"  # SentencePiece .model file
vocab_size: 3500

# Training hyperparameters
batch_size: 16
val_batch_size: 32  # Validation batch size (tăng lên để validation nhanh hơn)
# Tăng tổng số epoch để resume vượt mốc 20
num_epochs: 50
learning_rate: 0.0003
weight_decay: 0.0001
grad_clip: 0.5
gradient_accumulation_steps: 4
warmup_pct: 0.03  # Giảm từ 10% xuống 3% để model học nhanh hơn
use_constant_lr_on_resume: false

# Optimization
use_amp: true
num_workers: 12
pin_memory: true
prefetch_factor: 4
persistent_workers: true
sort_by_length: true
cache_in_ram: false
use_bucketing: false

# Data
dataset_root: "data/processed/full_merged_dataset"
language_filter: null

# Timestamp training
use_timestamps: true
timestamp_loss_weight: 0.01

# Decoding - Greedy Decode (beam search removed for speed)
# Using greedy CTC decode for fast and efficient decoding

# Checkpointing
checkpoint_dir: "checkpoints"
save_every: 5

# Logging
log_file: "logs/training.log"

# Training run
run_name: "vietnamese_asr_transformer_bilingual_36m"

# Auto-Rollback
auto_rollback:
  enabled: true
  threshold_ratio: 1.3
  patience: 1

# Curriculum Learning
curriculum_learning:
  enabled: true
  start_timestamp_epoch: 5
  required_wer: 0.70
  initial_ts_weight: 0.01
  short_sentence_epochs: 3
  max_duration_seconds: 4.0

