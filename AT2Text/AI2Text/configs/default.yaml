# Default configuration for ASR training
# Optimized for Vietnamese speech recognition on resource-constrained hardware

# Model architecture (300M parameters)
model_name: "VietnameseASR_300M"
d_model: 1024              # Increased from 256 (4x) for 300M model
num_encoder_layers: 24     # Increased from 6 (4x) for 300M model
num_heads: 16              # Increased from 4 (4x) for 300M model
d_ff: 4096                 # Increased from 1024 (4x) for 300M model
dropout: 0.1

# Audio processing
sample_rate: 16000
n_mels: 80
n_fft: 400
hop_length: 160
win_length: 400

# Tokenization
tokenizer_type: "bpe"          # "char" for character-level, "bpe" for subword BPE
bpe_vocab_path: "models/bilingual_bpe_18k.json"  # Fixed vocabulary for all training stages
vocab_size: 18000  # Fixed vocabulary size - DO NOT CHANGE

# Training hyperparameters (adjusted for 300M model)
batch_size: 4                  # Optimized for RTX 5060 Ti 16GB
num_epochs: 50                 # More epochs for larger model
learning_rate: 0.00015          # Optimized for 300M model (1.5e-4)
weight_decay: 0.01              # L2 regularization
grad_clip: 1.0                   # Gradient clipping to prevent exploding gradients
gradient_accumulation_steps: 4  # Effective batch size = 4 * 4 = 16
warmup_pct: 0.2                 # 20% warmup for large models

# Optimization for powerful hardware (Ryzen 9 9900X, RTX 5060 Ti)
use_amp: true                  # Automatic Mixed Precision
num_workers: 8                 # More workers for Ryzen 9 9900X (24 cores)
pin_memory: true
prefetch_factor: 4             # Larger prefetch for better pipelining

# Data
database_path: "database/asr_training.db"
split_version: "v1"

# Timestamp training
use_timestamps: true  # Enable timestamp prediction
timestamp_loss_weight: 0.1  # Weight for timestamp loss (0.0 to disable)

# Checkpointing
checkpoint_dir: "checkpoints"
save_every: 5

# Logging
log_file: "logs/training.log"

# Training run
run_name: "vietnamese_asr_300m_20251130"

