<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ASR测试页面</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .container {
            background: white;
            color: #333;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        h1 { color: #667eea; }
        .test-section {
            margin: 20px 0;
            padding: 15px;
            background: #f5f5f5;
            border-radius: 5px;
        }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            margin: 5px;
        }
        button:hover { background: #5568d3; }
        .result {
            margin-top: 10px;
            padding: 10px;
            background: #e8f5e9;
            border-radius: 5px;
            display: none;
        }
        .error {
            background: #ffebee;
            color: #c62828;
        }
        .success {
            background: #e8f5e9;
            color: #2e7d32;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎤 ASR系统测试页面</h1>
        <p>这是一个简单的测试页面，用于验证系统是否正常工作。</p>
        
        <div class="test-section">
            <h3>1. 测试后端API连接</h3>
            <button onclick="testBackend()">测试后端API</button>
            <div id="backendResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <h3>2. 测试模型列表</h3>
            <button onclick="testModels()">获取模型列表</button>
            <div id="modelsResult" class="result"></div>
        </div>
        
        <div class="test-section">
            <h3>3. 测试前端服务</h3>
            <p>如果您能看到这个页面，说明前端服务正常工作！</p>
            <p>当前时间: <span id="currentTime"></span></p>
        </div>
        
        <div class="test-section">
            <h3>4. 访问完整界面</h3>
            <p>如果这个测试页面可以访问，完整界面应该也可以访问：</p>
            <a href="http://localhost:8080/index.html" style="color: #667eea; font-weight: bold;">点击访问完整界面</a>
        </div>
    </div>
    
    <script>
        document.getElementById('currentTime').textContent = new Date().toLocaleString();
        
        async function testBackend() {
            const resultDiv = document.getElementById('backendResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = '正在测试...';
            
            try {
                const response = await fetch('http://localhost:8000/health');
                const data = await response.json();
                resultDiv.className = 'result success';
                resultDiv.innerHTML = '<strong>✓ 后端API正常！</strong><br>' + 
                    '状态: ' + data.status + '<br>' +
                    'Tokenizer: ' + data.tokenizer_ready + '<br>' +
                    '处理器: ' + data.processor_ready;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '<strong>✗ 后端API连接失败</strong><br>' + error.message;
            }
        }
        
        async function testModels() {
            const resultDiv = document.getElementById('modelsResult');
            resultDiv.style.display = 'block';
            resultDiv.className = 'result';
            resultDiv.textContent = '正在获取模型列表...';
            
            try {
                const response = await fetch('http://localhost:8000/models');
                const data = await response.json();
                resultDiv.className = 'result success';
                let html = '<strong>✓ 模型列表获取成功！</strong><br>总模型数: ' + data.total + '<br><ul>';
                data.models.forEach(model => {
                    html += '<li>' + model.name + ' (' + model.size_mb + ' MB)</li>';
                });
                html += '</ul>';
                resultDiv.innerHTML = html;
            } catch (error) {
                resultDiv.className = 'result error';
                resultDiv.innerHTML = '<strong>✗ 获取模型列表失败</strong><br>' + error.message;
            }
        }
    </script>
</body>
</html>
