<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>越南语语音转文字系统 - ASR</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <h1>🎤 越南语语音转文字系统</h1>
            <p class="subtitle">Vietnamese Speech-to-Text ASR System</p>
            <div class="status-indicator" id="statusIndicator">
                <span class="status-dot"></span>
                <span class="status-text">检查连接中...</span>
            </div>
        </header>

        <main class="main-content">
            <!-- 模型管理区域 -->
            <section class="card model-section">
                <h2>📦 模型管理</h2>
                <div class="model-controls">
                    <button class="btn btn-primary" id="refreshModelsBtn">刷新模型列表</button>
                    <button class="btn btn-secondary" id="checkHealthBtn">检查服务状态</button>
                </div>
                <div class="model-info" id="modelInfo" style="display: none;">
                    <div class="info-item">
                        <label>已训练模型:</label>
                        <span id="trainedModelsCount">0</span>
                    </div>
                    <div class="info-item">
                        <label>已加载模型:</label>
                        <span id="loadedModelsCount">0</span>
                    </div>
                </div>
                <div class="model-list" id="modelList">
                    <p class="loading-text">加载中...</p>
                </div>
            </section>

            <!-- 转录区域 -->
            <section class="card transcription-section">
                <h2>🎵 音频转录</h2>
                <form id="transcriptionForm" class="transcription-form">
                    <div class="form-group">
                        <label for="audioFile">选择音频文件</label>
                        <div class="file-input-wrapper">
                            <input type="file" id="audioFile" accept="audio/*" required>
                            <span class="file-input-label" id="fileLabel">点击选择或拖拽文件到此处</span>
                        </div>
                        <audio id="audioPreview" controls style="display: none; width: 100%; margin-top: 10px;"></audio>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="modelSelect">选择模型</label>
                            <select id="modelSelect" class="form-control">
                                <option value="default">默认模型</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="beamWidth">Beam宽度</label>
                            <input type="number" id="beamWidth" class="form-control" value="5" min="1" max="20" />
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="useBeamSearch" checked>
                                <span>使用Beam Search</span>
                            </label>
                        </div>

                        <div class="form-group checkbox-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="useLM">
                                <span>使用语言模型</span>
                            </label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary btn-large" id="transcribeBtn">
                        <span class="btn-text">开始转录</span>
                        <span class="btn-loader" style="display: none;"></span>
                    </button>
                </form>
            </section>

            <!-- 结果显示区域 -->
            <section class="card result-section" id="resultSection" style="display: none;">
                <h2>📝 转录结果</h2>
                <div class="result-content">
                    <div class="result-item">
                        <label>转录文本:</label>
                        <div class="result-text" id="resultText">-</div>
                    </div>
                    <div class="result-metrics">
                        <div class="metric">
                            <span class="metric-label">置信度:</span>
                            <span class="metric-value" id="confidenceValue">-</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">处理时间:</span>
                            <span class="metric-value" id="processingTime">-</span>
                        </div>
                        <div class="metric">
                            <span class="metric-label">使用模型:</span>
                            <span class="metric-value" id="modelUsed">-</span>
                        </div>
                    </div>
                    <button class="btn btn-secondary" id="copyResultBtn">复制结果</button>
                </div>
            </section>

            <!-- 错误提示区域 -->
            <div class="error-message" id="errorMessage" style="display: none;"></div>
        </main>

        <footer class="footer">
            <p>ASR System v1.0.0 | Powered by FastAPI</p>
        </footer>
    </div>

    <script src="app.js"></script>
</body>
</html>
